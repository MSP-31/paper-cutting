<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>종이 자르기 물리 엔진 베이스</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="toolbar">
            <button id="toggleMenuButton" class="toggle-menu">◀</button>
            <button id="cutButton" class="active">자르기</button>
            <button id="tearButton">오리기</button>
            <button id="grabButton">잡기</button>
            <button id="pinButton">고정</button>
            <div class="create-folder">
                <button id="createMenuButton" class="create-toggle">만들기 ▸</button>
                <div class="create-menu hidden" id="createMenu">
                    <button id="createRectButton">⬛ 사각형</button>
                    <button id="createCircleButton">⚪ 원</button>
                    <button id="createTriangleButton">🔺 삼각형</button>
                    <button id="createFreeButton">✏️ 자유형</button>
                </div>
            </div>
            <button id="deleteButton">제거</button>
            <button id="resetButton">다시하기</button>
        </div>
        <canvas id="canvas"></canvas>
        <script src="script.js"></script>
    </body>
</html>
